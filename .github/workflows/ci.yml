name: CI

on:
  push:
  pull_request:

jobs:
  main-stack:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up exact CPython 3.8.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"

      - name: Verify exact interpreter
        run: python -c "import sys; assert sys.version_info[:3] == (3, 8, 10), sys.version"

      - name: Install main stack
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check

      - name: Verify main pins
        run: |
          python -c "import river; assert river.__version__ == '0.10.1', river.__version__"
          python -c "import xgboost; assert xgboost.__version__ == '2.1.4', xgboost.__version__"

      - name: Compile
        run: python -m compileall -q .

      - name: Tests
        run: pytest -q

  oaml-river-compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up exact CPython 3.8.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"

      - name: Verify exact interpreter
        run: python -c "import sys; assert sys.version_info[:3] == (3, 8, 10), sys.version"

      - name: Install validated OAML River compatibility core
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install numpy==1.23.5 pandas==1.3.5 scipy==1.10.1 scikit-learn==1.1.3
          python -m pip install --only-binary=:all: river==0.8.0
          python -m pip check

      - name: Verify OAML pins
        run: |
          python -c "import numpy, pandas, scipy, sklearn, river; assert numpy.__version__ == '1.23.5'; assert pandas.__version__ == '1.3.5'; assert scipy.__version__ == '1.10.1'; assert sklearn.__version__ == '1.1.3'; assert river.__version__ == '0.8.0'"

      - name: Compile OAML worker
        run: python -m py_compile awareml/workers/oaml_worker.py
